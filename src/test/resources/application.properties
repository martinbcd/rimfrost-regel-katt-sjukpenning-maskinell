application.config.path=src/test/resources/config-test.yaml

rimfrost.framework.regel.maskinell.retry.intervals=1

# Slumpad port så att testerna inte krockar med annat som lyssnar på 8081
quarkus.http.test-port=0

# Url paths, överskrivs av WireMockKattSjukpenningMaskinell

handlaggning.api.base-url=http://localhost:8080
folkbokford.api.base-url=http://localhost:8080
arbetsgivare.api.base-url=http://localhost:8080

#Kafka
kafka.source=KattSjukpenningMaskinellTest
mp.messaging.incoming.regel-requests.connector=smallrye-in-memory
mp.messaging.outgoing.regel-responses.connector=smallrye-in-memory

# Kafka off for tests because of in-memory connector
quarkus.kafka.devservices.enabled=false
